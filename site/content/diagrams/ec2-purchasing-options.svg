<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EC2 purchasing options compared by cost, commitment, and flexibility">
  <style>
    .axis { stroke: #25395a; stroke-width: 1.5; }
    .axlbl { fill: #8aa0bd; font: 11px system-ui, sans-serif; }
    .box { fill: #1d3150; stroke: #4aa3ff; }
    .spot { fill: #1d3150; stroke: #2ecc71; }
    .ded { fill: #16263d; stroke: #ff9900; stroke-dasharray: 6 4; }
    .bt { fill: #e8eef6; font: 600 12px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #8aa0bd; font: 10px system-ui, sans-serif; text-anchor: middle; }
    .ttl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <text x="380" y="28" class="ttl">Higher cost, no commitment, full flexibility  →  Lower cost, longer commitment or interruption risk</text>

  <line class="axis" x1="40" y1="240" x2="720" y2="240"/>
  <text x="40" y="264" class="axlbl">always available · pay per second</text>
  <text x="540" y="264" class="axlbl">cheapest · can be reclaimed / locked-in</text>
  <text x="40" y="282" class="axlbl">flexible workloads</text>
  <text x="600" y="282" class="axlbl">fault-tolerant / steady baseline</text>

  <rect class="box" x="40" y="110" width="150" height="115" rx="8"/>
  <text class="bt" x="115" y="140">On-Demand</text>
  <text class="sub" x="115" y="162">no commit</text>
  <text class="sub" x="115" y="178">highest price</text>
  <text class="sub" x="115" y="200">dev/test, unpredictable</text>

  <rect class="box" x="210" y="95" width="170" height="130" rx="8"/>
  <text class="bt" x="295" y="125">Savings Plans /</text>
  <text class="bt" x="295" y="141">Reserved Instances</text>
  <text class="sub" x="295" y="165">1y or 3y commit</text>
  <text class="sub" x="295" y="181">up to ~72% off</text>
  <text class="sub" x="295" y="203">steady 24/7 baseline</text>

  <rect class="spot" x="400" y="80" width="160" height="145" rx="8"/>
  <text class="bt" x="480" y="110">Spot</text>
  <text class="sub" x="480" y="132">spare capacity</text>
  <text class="sub" x="480" y="148">up to ~90% off</text>
  <text class="sub" x="480" y="170">2-min interruption</text>
  <text class="sub" x="480" y="186">warning</text>
  <text class="sub" x="480" y="208">batch, CI, stateless</text>

  <rect class="ded" x="580" y="105" width="150" height="120" rx="8"/>
  <text class="bt" x="655" y="135">Dedicated Host</text>
  <text class="sub" x="655" y="158">physical server</text>
  <text class="sub" x="655" y="174">BYOL / compliance</text>
  <text class="sub" x="655" y="196">licence isolation</text>
</svg>
