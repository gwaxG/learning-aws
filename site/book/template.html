<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>AWS SAA-C03: конспект</title>
<style>
:root{--bg:#10151c;--fg:#e6ebf1;--mut:#9aa7b5;--card:#18202a;--line:#2a3542;--acc:#ff9900;--lnk:#6cb6ff;
--hi:#ff5c5c;--mid:#ff9f43;--lo:#e6c84a;--code:#0c1117;--ok:#4cc38a}
html[data-theme=light]{--bg:#fbfaf7;--fg:#1b232c;--mut:#5b6773;--card:#f0eee8;--line:#d8d4ca;--acc:#c46f00;--lnk:#0b5fb3;
--hi:#c62828;--mid:#d9660a;--lo:#8a7400;--code:#e9e6de;--ok:#1b7f55}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.62 Georgia,"Iowan Old Style","Noto Serif",serif;padding-bottom:60px}
main{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4,.bar,.b,nav,table,.box,button{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
h1{font-size:1.9rem;line-height:1.2;margin:28px 0 8px}
h2{font-size:1.45rem;margin:0 0 10px;padding-top:6px;line-height:1.25}
h3{font-size:1.15rem;margin:22px 0 6px;color:var(--acc);line-height:1.3}
h4{font-size:1rem;margin:16px 0 4px}
p{margin:.55em 0}
ul,ol{padding-left:1.25em;margin:.5em 0}li{margin:.25em 0}
a{color:var(--lnk)}
code{background:var(--code);padding:.08em .35em;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.bar .t{flex:1;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.9rem;cursor:pointer}
button.on{border-color:var(--hi);color:var(--hi)}
#pg{position:fixed;top:0;left:0;height:3px;background:var(--acc);width:0;z-index:30}
nav#toc{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;padding:16px;padding-top:calc(60px + env(safe-area-inset-top));display:none}
nav#toc.open{display:block}
nav#toc a{display:flex;gap:8px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:1rem}
nav#toc a span.n{color:var(--mut);min-width:1.7em}
.b{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle;letter-spacing:.02em;margin-left:6px;color:#111}
.b3{background:var(--hi)}.b2{background:var(--mid)}.b1{background:var(--lo)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:auto;flex:none}
.d3{background:var(--hi)}.d2{background:var(--mid)}.d1{background:var(--lo)}
section.ch{border-top:1px solid var(--line);margin-top:30px;padding-top:6px}
section.ch[data-weak="3"]>h2{border-left:4px solid var(--hi);padding-left:10px}
section.ch[data-weak="2"]>h2{border-left:4px solid var(--mid);padding-left:10px}
section.ch[data-weak="1"]>h2{border-left:4px solid var(--lo);padding-left:10px}
.sub[data-weak="3"]{border-left:3px solid var(--hi);padding-left:10px;margin-left:-13px}
.sub[data-weak="2"]{border-left:3px solid var(--mid);padding-left:10px;margin-left:-13px}
.sub[data-weak="1"]{border-left:3px solid var(--lo);padding-left:10px;margin-left:-13px}
.box{border-radius:12px;padding:10px 13px;margin:12px 0;font-size:.95rem;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.box b:first-child{display:block;margin-bottom:2px}
.miss{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 10%,var(--card))}
.trap{border-color:var(--mid)}.tip{border-color:var(--ok)}
.tw{overflow-x:auto;margin:12px -16px;padding:0 16px}
table{border-collapse:collapse;font-size:.88rem;line-height:1.4;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card);position:sticky;top:0}
.onlyweak section.ch:not([data-weak]){display:none}
.onlyweak .sub:not([data-weak]){display:none}
.onlyweak .nw{display:none}
.hero{padding:10px 0 4px}.hero p{color:var(--mut)}
.legend span{margin-right:12px;font-family:-apple-system,"Segoe UI",sans-serif;font-size:.85rem}
.up{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;opacity:.85}
@media print{.bar,#pg,.up,nav{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="pg"></div>
<div class="bar"><button id="mb" aria-label="Оглавление">☰</button><div class="t">SAA-C03 · конспект</div><button id="wb" title="Только слабые места">🔴 слабые</button><button id="tb" title="Тема">◐</button></div>
<nav id="toc"><h1 style="margin-top:0">Оглавление</h1><!--TOC--></nav>
<main>
<!--BODY-->
</main>
<button class="up" id="up" aria-label="Наверх">↑</button>
<script>
(function(){
var d=document,h=d.documentElement,S=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
var th=S('saa-theme');if(th)h.dataset.theme=th;
d.getElementById('tb').onclick=function(){var t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;S('saa-theme',t)};
var toc=d.getElementById('toc');
d.getElementById('mb').onclick=function(){toc.classList.toggle('open')};
toc.addEventListener('click',function(e){if(e.target.closest('a'))toc.classList.remove('open')});
var wb=d.getElementById('wb');
wb.onclick=function(){var on=d.body.classList.toggle('onlyweak');wb.classList.toggle('on',on);S('saa-weak',on?'1':'0');window.scrollTo(0,0)};
if(S('saa-weak')==='1'){d.body.classList.add('onlyweak');wb.classList.add('on')}
d.getElementById('up').onclick=function(){window.scrollTo({top:0})};
var pg=d.getElementById('pg'),tm;
addEventListener('scroll',function(){var m=d.body.scrollHeight-innerHeight;pg.style.width=(m>0?scrollY/m*100:0)+'%';clearTimeout(tm);tm=setTimeout(function(){S('saa-y',String(Math.round(scrollY)))},300)},{passive:true});
var y=parseInt(S('saa-y')||'0',10);if(y>0&&!location.hash)setTimeout(function(){scrollTo(0,y)},50);
})();
</script>
</body>
</html>
