<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Security Group vs Network ACL: stateful allow на уровне instance против stateless allow и deny на уровне subnet">
  <style>
    .ttl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
    .col-sg { fill: #1d3150; stroke: #2ecc71; stroke-width: 2; }
    .col-nacl { fill: #1d3150; stroke: #e74c3c; stroke-width: 2; }
    .hdr { fill: #e8eef6; font: 700 13px system-ui, sans-serif; text-anchor: middle; }
    .row { fill: #16263d; stroke: #25395a; }
    .key { fill: #ff9900; font: 700 11px system-ui, sans-serif; }
    .val { fill: #e8eef6; font: 600 12px system-ui, sans-serif; }
    .sub { fill: #8aa0bd; font: 11px system-ui, sans-serif; text-anchor: middle; }
    .warn { fill: #ff9900; font: 600 11px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <text x="380" y="22" class="ttl">Security Group vs Network ACL</text>

  <!-- SG column -->
  <rect class="col-sg" x="30" y="40" width="340" height="240" rx="10"/>
  <text x="200" y="62" class="hdr">Security Group</text>
  <text x="200" y="80" class="sub">уровень instance / ENI</text>

  <rect class="row" x="46" y="96" width="308" height="34" rx="6"/>
  <text x="58" y="118" class="key">Состояние</text>
  <text x="130" y="118" class="val">STATEFUL — ответ разрешён</text>

  <rect class="row" x="46" y="138" width="308" height="34" rx="6"/>
  <text x="58" y="160" class="key">Правила</text>
  <text x="130" y="160" class="val">только ALLOW (без deny)</text>

  <rect class="row" x="46" y="180" width="308" height="34" rx="6"/>
  <text x="58" y="202" class="key">Оценка</text>
  <text x="130" y="202" class="val">все правила вместе</text>

  <rect class="row" x="46" y="222" width="308" height="46" rx="6"/>
  <text x="58" y="244" class="key">Где</text>
  <text x="130" y="244" class="val">на ENI / EC2 / RDS</text>
  <text x="130" y="260" class="val">не блокирует конкретный IP</text>

  <!-- NACL column -->
  <rect class="col-nacl" x="390" y="40" width="340" height="240" rx="10"/>
  <text x="560" y="62" class="hdr">Network ACL</text>
  <text x="560" y="80" class="sub">уровень subnet</text>

  <rect class="row" x="406" y="96" width="308" height="34" rx="6"/>
  <text x="418" y="118" class="key">Состояние</text>
  <text x="490" y="118" class="val">STATELESS — оба направления</text>

  <rect class="row" x="406" y="138" width="308" height="34" rx="6"/>
  <text x="418" y="160" class="key">Правила</text>
  <text x="490" y="160" class="val">ALLOW + DENY</text>

  <rect class="row" x="406" y="180" width="308" height="34" rx="6"/>
  <text x="418" y="202" class="key">Оценка</text>
  <text x="490" y="202" class="val">по номеру, 1-е совпадение</text>

  <rect class="row" x="406" y="222" width="308" height="46" rx="6"/>
  <text x="418" y="244" class="key">Где</text>
  <text x="490" y="244" class="val">блок IP правилом deny</text>
  <text x="490" y="260" class="val">защищает весь subnet</text>

  <!-- Ephemeral ports footer -->
  <rect x="30" y="298" width="700" height="46" rx="8" fill="#16263d" stroke="#ff9900" stroke-dasharray="6 4"/>
  <text x="380" y="318" class="warn">Ловушка: stateless NACL должен разрешать OUTBOUND ephemeral-порты 1024–65535 для ответа</text>
  <text x="380" y="334" class="sub">Security Group делает это автоматически, NACL — нет.</text>
</svg>
