<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECS на EC2, AWS Fargate и EKS (управляемый Kubernetes)">
  <style>
    .ttl { fill: #ff9900; font: 700 13px system-ui, sans-serif; }
    .lbl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
    .card { fill: #1d3150; stroke: #4aa3ff; }
    .card-green { fill: #1d3150; stroke: #2ecc71; }
    .card-orange { fill: #16263d; stroke: #ff9900; stroke-dasharray: 5 3; }
    .nodet { fill: #e8eef6; font: 600 12px system-ui, sans-serif; text-anchor: middle; }
    .row { fill: #e8eef6; font: 12px system-ui, sans-serif; }
    .sub { fill: #8aa0bd; font: 11px system-ui, sans-serif; }
    .subc { fill: #8aa0bd; font: 11px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <text x="20" y="24" class="ttl">Выбор вычислительной модели для контейнеров</text>

  <!-- ECS on EC2 -->
  <rect class="card" x="20" y="40" width="230" height="240" rx="10"/>
  <text x="135" y="62" class="lbl">ECS на EC2</text>
  <text x="135" y="80" class="subc">кластер управляете вы</text>

  <rect class="card" x="40" y="98" width="190" height="36" rx="6"/>
  <text class="nodet" x="135" y="121">Свои EC2 instances</text>

  <rect class="card" x="40" y="142" width="190" height="36" rx="6"/>
  <text class="nodet" x="135" y="165">ECS agent · Docker</text>

  <rect class="card" x="40" y="186" width="190" height="36" rx="6"/>
  <text class="nodet" x="135" y="209">Tasks (контейнеры)</text>

  <text x="40" y="244" class="sub">+ Spot / RI / SP для экономии</text>
  <text x="40" y="260" class="sub">− патчи ОС, масштаб узлов</text>
  <text x="40" y="276" class="sub">− оплата простоя</text>

  <!-- Fargate -->
  <rect class="card-green" x="265" y="40" width="230" height="240" rx="10"/>
  <text x="380" y="62" class="lbl">AWS Fargate</text>
  <text x="380" y="80" class="subc">serverless-контейнеры</text>

  <rect class="card-green" x="285" y="98" width="190" height="36" rx="6"/>
  <text class="nodet" x="380" y="121">compute управляет AWS</text>

  <rect class="card-green" x="285" y="142" width="190" height="36" rx="6"/>
  <text class="nodet" x="380" y="165">vCPU + память на task</text>

  <rect class="card-green" x="285" y="186" width="190" height="36" rx="6"/>
  <text class="nodet" x="380" y="209">Tasks (контейнеры)</text>

  <text x="285" y="244" class="sub">+ нет узлов и патчей</text>
  <text x="285" y="260" class="sub">+ оплата task, пока работает</text>
  <text x="285" y="276" class="sub">− дороже оптимизир. EC2</text>

  <!-- EKS -->
  <rect class="card-orange" x="510" y="40" width="230" height="240" rx="10"/>
  <text x="625" y="62" class="lbl">Amazon EKS</text>
  <text x="625" y="80" class="subc">управляемый Kubernetes</text>

  <rect class="card-orange" x="530" y="98" width="190" height="36" rx="6"/>
  <text class="nodet" x="625" y="121">K8s control plane (AWS)</text>

  <rect class="card-orange" x="530" y="142" width="190" height="36" rx="6"/>
  <text class="nodet" x="625" y="165">Data plane: EC2/Fargate</text>

  <rect class="card-orange" x="530" y="186" width="190" height="36" rx="6"/>
  <text class="nodet" x="625" y="209">Pods · Helm · операторы</text>

  <text x="530" y="244" class="sub">+ переносимость (K8s)</text>
  <text x="530" y="260" class="sub">− почасово за control plane</text>
  <text x="530" y="276" class="sub">− макс. сложность ops</text>

  <text x="20" y="310" class="sub">Правило: стабильная высокая нагрузка и нужен контроль → EC2 · пики / без ops → Fargate · нужен Kubernetes → EKS</text>
</svg>
