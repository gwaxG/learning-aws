<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Классы хранения S3 по частоте доступа, стоимости и времени извлечения">
  <style>
    .axis { stroke: #25395a; stroke-width: 1.5; }
    .axlbl { fill: #8aa0bd; font: 11px system-ui, sans-serif; }
    .cls { fill: #1d3150; stroke: #4aa3ff; }
    .clst { fill: #e8eef6; font: 600 11px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #8aa0bd; font: 10px system-ui, sans-serif; text-anchor: middle; }
    .ttl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <text x="380" y="30" class="ttl">Горячее / дороже, мгновенный доступ  →  Холоднее / дешевле, медленнее извлечение</text>

  <!-- axis -->
  <line class="axis" x1="40" y1="220" x2="720" y2="220"/>
  <text x="40" y="245" class="axlbl">частый доступ</text>
  <text x="720" y="245" class="axlbl" style="text-anchor:end">архив</text>
  <text x="40" y="262" class="axlbl">$$$ хранение · $0 доступ</text>
  <text x="720" y="262" class="axlbl" style="text-anchor:end">$ хранение · $$ доступ</text>

  <rect class="cls" x="40" y="90" width="105" height="110" rx="6"/><text class="clst" x="92" y="130">S3</text><text class="clst" x="92" y="146">Standard</text><text class="sub" x="92" y="170">мс · без платы</text>
  <rect class="cls" x="155" y="100" width="105" height="100" rx="6"/><text class="clst" x="207" y="138">Intelligent-</text><text class="clst" x="207" y="154">Tiering</text><text class="sub" x="207" y="176">авто · без платы</text>
  <rect class="cls" x="270" y="115" width="105" height="85" rx="6"/><text class="clst" x="322" y="150">Standard-IA</text><text class="sub" x="322" y="174">мс · мин. 30 дн</text>
  <rect class="cls" x="385" y="130" width="105" height="70" rx="6"/><text class="clst" x="437" y="160">Glacier Instant</text><text class="sub" x="437" y="184">мс · мин. 90 дн</text>
  <rect class="cls" x="500" y="145" width="105" height="55" rx="6"/><text class="clst" x="552" y="170">Glacier Flexible</text><text class="sub" x="552" y="190">мин–часы</text>
  <rect class="cls" x="615" y="160" width="105" height="40" rx="6"/><text class="clst" x="667" y="178">Deep Archive</text><text class="sub" x="667" y="194">12–48 ч · 180 дн</text>
</svg>
