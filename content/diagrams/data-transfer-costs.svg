<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта стоимости передачи данных AWS: ingress бесплатно, egress в интернет платно, cross-AZ платно, внутри AZ бесплатно, обработка NAT платно; смягчение через S3 Gateway endpoint и CloudFront">
  <style>
    .ttl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
    .vpc { fill: none; stroke: #ff9900; stroke-width: 2; stroke-dasharray: 6 4; }
    .az  { fill: none; stroke: #25395a; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .box { fill: #1d3150; stroke: #4aa3ff; }
    .nat { fill: #1d3150; stroke: #ff9900; }
    .ext { fill: #16263d; stroke: #25395a; }
    .good { fill: #1d3150; stroke: #2ecc71; }
    .node { fill: #e8eef6; font: 600 12px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #8aa0bd; font: 10px system-ui, sans-serif; text-anchor: middle; }
    .lbl { fill: #ff9900; font: 700 11px system-ui, sans-serif; }
    .free { stroke: #2ecc71; stroke-width: 1.8; fill: none; marker-end: url(#arrG); }
    .paid { stroke: #ff9900; stroke-width: 1.8; fill: none; marker-end: url(#arrO); stroke-dasharray: 5 3; }
    .priceFree { fill: #2ecc71; font: 700 10px system-ui, sans-serif; }
    .pricePaid { fill: #ff9900; font: 700 10px system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2ecc71"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff9900"/>
    </marker>
  </defs>

  <text x="380" y="22" class="ttl">Стоимость передачи данных AWS (зелёный = бесплатно, оранжевый = платно)</text>

  <!-- VPC outline -->
  <rect class="vpc" x="30" y="40" width="500" height="280" rx="10"/>
  <text x="44" y="60" class="lbl">VPC (регион)</text>

  <!-- AZ-A -->
  <rect class="az" x="50" y="76" width="220" height="170" rx="8"/>
  <text x="60" y="92" class="sub">AZ-A</text>
  <rect class="box" x="70" y="100" width="80" height="50" rx="6"/>
  <text x="110" y="120" class="node">EC2-1</text>
  <text x="110" y="136" class="sub">priv subnet</text>
  <rect class="box" x="170" y="100" width="80" height="50" rx="6"/>
  <text x="210" y="120" class="node">EC2-2</text>
  <text x="210" y="136" class="sub">priv IP</text>
  <path class="free" d="M150,125 L170,125"/>
  <text x="160" y="97" class="priceFree" text-anchor="middle">БЕСПЛ.</text>
  <text x="160" y="172" class="sub">private IP внутри AZ</text>

  <!-- NAT GW -->
  <rect class="nat" x="70" y="186" width="180" height="48" rx="6"/>
  <text x="160" y="206" class="node">NAT Gateway</text>
  <text x="160" y="222" class="sub">почасово + за ГБ</text>

  <!-- AZ-B -->
  <rect class="az" x="290" y="76" width="220" height="170" rx="8"/>
  <text x="300" y="92" class="sub">AZ-B</text>
  <rect class="box" x="310" y="100" width="80" height="50" rx="6"/>
  <text x="350" y="120" class="node">EC2-3</text>
  <text x="350" y="136" class="sub">priv subnet</text>

  <!-- cross-AZ -->
  <path class="paid" d="M250,125 L310,125"/>
  <text x="280" y="116" class="pricePaid">$ cross-AZ</text>

  <!-- S3 Gateway endpoint -->
  <rect class="good" x="310" y="170" width="180" height="64" rx="6"/>
  <text x="400" y="192" class="node">S3 Gateway endpoint</text>
  <text x="400" y="208" class="sub">бесплатно · в обход NAT</text>
  <text x="400" y="224" class="sub">DynamoDB тоже</text>
  <path class="free" d="M350,150 L390,170"/>

  <!-- Outside VPC: Internet, S3, CloudFront -->
  <rect class="ext" x="560" y="60" width="180" height="56" rx="8"/>
  <text x="650" y="84" class="node">Интернет</text>
  <text x="650" y="100" class="sub">пользователи / внешние</text>

  <rect class="ext" x="560" y="135" width="180" height="56" rx="8"/>
  <text x="650" y="159" class="node">Amazon S3</text>
  <text x="650" y="175" class="sub">в том же регионе</text>

  <rect class="good" x="560" y="210" width="180" height="56" rx="8"/>
  <text x="650" y="234" class="node">CloudFront</text>
  <text x="650" y="250" class="sub">кэш · дешевле egress</text>

  <!-- Ingress (free) -->
  <path class="free" d="M560,88 L255,210"/>
  <text x="395" y="160" class="priceFree">ingress БЕСПЛАТНО</text>

  <!-- Egress to internet via NAT ($$) -->
  <path class="paid" d="M250,210 L560,88"/>
  <text x="395" y="200" class="pricePaid">$$ NAT за ГБ + $ egress</text>

  <!-- S3 direct via Gateway endpoint (free path) -->
  <path class="free" d="M490,200 L560,162"/>
  <text x="525" y="186" class="priceFree">беспл. (Gateway EP)</text>

  <!-- CloudFront reduces egress -->
  <path class="free" d="M650,210 L650,200"/>
  <path class="paid" d="M560,238 L255,238"/>

  <!-- Legend / hints -->
  <rect class="ext" x="30" y="325" width="710" height="32" rx="6"/>
  <text x="385" y="338" class="sub"><tspan x="385">Ingress в AWS: бесплатно · private IP внутри AZ: бесплатно · cross-AZ: платно в обе стороны · egress в интернет: платно</tspan><tspan x="385" dy="13">обработка NAT: платно · S3 Gateway endpoint обходит NAT · CloudFront кэширует на edge и снижает egress</tspan></text>
</svg>
