<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Сравнение моделей оплаты вычислений AWS: On-Demand, Savings Plans, Reserved Instances и Spot, с подсказками по применению">
  <style>
    .axis { stroke: #25395a; stroke-width: 1.5; }
    .axlbl { fill: #8aa0bd; font: 11px system-ui, sans-serif; }
    .box { fill: #1d3150; stroke: #4aa3ff; }
    .spot { fill: #1d3150; stroke: #2ecc71; }
    .hint { fill: #16263d; stroke: #ff9900; stroke-dasharray: 6 4; }
    .bt { fill: #e8eef6; font: 600 12px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #8aa0bd; font: 10px system-ui, sans-serif; text-anchor: middle; }
    .ttl { fill: #ff9900; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
    .hintlbl { fill: #ff9900; font: 700 11px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <text x="380" y="24" class="ttl">Оплата вычислений AWS: без обязательств  →  макс. скидка за обязательства или прерывания</text>

  <line class="axis" x1="40" y1="248" x2="720" y2="248"/>
  <text x="40" y="270" class="axlbl">pay-as-you-go · макс. гибкость</text>
  <text x="560" y="270" class="axlbl">дешевле · с оговорками</text>

  <!-- On-Demand -->
  <rect class="box" x="40" y="60" width="150" height="170" rx="8"/>
  <text class="bt" x="115" y="86">On-Demand</text>
  <text class="sub" x="115" y="106">без обязательств</text>
  <text class="sub" x="115" y="122">посекундная оплата</text>
  <text class="sub" x="115" y="142">базовая цена</text>
  <text class="sub" x="115" y="172">для пиковых, коротких,</text>
  <text class="sub" x="115" y="186">непредсказуемых</text>
  <text class="sub" x="115" y="200">или новых приложений</text>

  <!-- Savings Plans -->
  <rect class="box" x="210" y="50" width="170" height="180" rx="8"/>
  <text class="bt" x="295" y="76">Savings Plans</text>
  <text class="sub" x="295" y="96">обязат. $/ч на 1 или 3 г.</text>
  <text class="sub" x="295" y="112">скидка до ~72%</text>
  <text class="sub" x="295" y="134">Compute SP: любой регион/</text>
  <text class="sub" x="295" y="148">сем./ОС · Fargate · Lambda</text>
  <text class="sub" x="295" y="168">EC2 Instance SP: сем.+регион</text>
  <text class="sub" x="295" y="184">SageMaker SP: нагрузки SM</text>
  <text class="sub" x="295" y="208">для стабильной базы</text>

  <!-- Reserved Instances -->
  <rect class="box" x="400" y="60" width="160" height="170" rx="8"/>
  <text class="bt" x="480" y="86">Reserved Instances</text>
  <text class="sub" x="480" y="106">1 или 3 г. · на семейство</text>
  <text class="sub" x="480" y="122">Standard: макс. скидка,</text>
  <text class="sub" x="480" y="136">перепродажа на Marketplace</text>
  <text class="sub" x="480" y="156">Convertible: меняет</text>
  <text class="sub" x="480" y="170">семейство / ОС / tenancy</text>
  <text class="sub" x="480" y="194">RDS/ElastiCache/OpenSearch</text>
  <text class="sub" x="480" y="208">имеют свои RI</text>

  <!-- Spot -->
  <rect class="spot" x="580" y="50" width="150" height="180" rx="8"/>
  <text class="bt" x="655" y="76">Spot</text>
  <text class="sub" x="655" y="96">свободные мощности</text>
  <text class="sub" x="655" y="112">скидка до ~90%</text>
  <text class="sub" x="655" y="134">прерывание с</text>
  <text class="sub" x="655" y="148">предупр. за 2 мин</text>
  <text class="sub" x="655" y="170">нет SLA / могут</text>
  <text class="sub" x="655" y="184">отобрать в любой момент</text>
  <text class="sub" x="655" y="208">batch · CI · stateless</text>

  <!-- Where-to-use hint band -->
  <rect class="hint" x="40" y="290" width="680" height="56" rx="8"/>
  <text x="380" y="310" class="hintlbl">Что где использовать</text>
  <text x="380" y="328" class="sub">стабильную базу 24/7 — Compute Savings Plans · всплески — On-Demand · отказоустойчивый</text>
  <text x="380" y="342" class="sub">batch — на Spot · RI — для RDS/ElastiCache/OpenSearch или для перепродажи неиспользованного</text>
</svg>
