<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eventual versus strong consistency trade-off across DynamoDB, RDS replicas, and S3">
  <style>
    .ttl { fill: #ff9900; font: 700 13px system-ui, sans-serif; text-anchor: middle; }
    .lbl { fill: #ff9900; font: 700 12px system-ui, sans-serif; }
    .node { fill: #1d3150; stroke: #4aa3ff; }
    .nodeg { fill: #1d3150; stroke: #2ecc71; }
    .nodet { fill: #e8eef6; font: 600 12px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #8aa0bd; font: 11px system-ui, sans-serif; text-anchor: middle; }
    .axlbl { fill: #8aa0bd; font: 11px system-ui, sans-serif; text-anchor: middle; }
    .divide { fill: none; stroke: #ff9900; stroke-width: 2; stroke-dasharray: 6 4; }
    .flow { stroke: #4aa3ff; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4aa3ff"/>
    </marker>
  </defs>

  <text x="380" y="26" class="ttl">Consistency trade-off: freshness vs latency &amp; cost</text>

  <!-- Divider -->
  <line class="divide" x1="380" y1="50" x2="380" y2="300"/>

  <!-- Eventual side -->
  <text x="190" y="60" class="lbl" text-anchor="middle">Eventual consistency</text>
  <text x="190" y="78" class="axlbl">low latency · cheaper · may be stale</text>

  <rect class="nodeg" x="40" y="100" width="300" height="50" rx="8"/>
  <text class="nodet" x="190" y="122">DynamoDB default read</text>
  <text class="sub" x="190" y="140">half the RCU cost · brief staleness window</text>

  <rect class="nodeg" x="40" y="170" width="300" height="50" rx="8"/>
  <text class="nodet" x="190" y="192">RDS / Aurora read replica</text>
  <text class="sub" x="190" y="210">scales reads · async replication lag</text>

  <rect class="nodeg" x="40" y="240" width="300" height="50" rx="8"/>
  <text class="nodet" x="190" y="262">S3 LIST after delete</text>
  <text class="sub" x="190" y="280">read-after-write is strong; LIST eventual historically</text>

  <!-- Strong side -->
  <text x="570" y="60" class="lbl" text-anchor="middle">Strong consistency</text>
  <text x="570" y="78" class="axlbl">latest write · higher cost · same region</text>

  <rect class="node" x="420" y="100" width="300" height="50" rx="8"/>
  <text class="nodet" x="570" y="122">DynamoDB ConsistentRead=true</text>
  <text class="sub" x="570" y="140">2x RCU · single-region only · no GSI</text>

  <rect class="node" x="420" y="170" width="300" height="50" rx="8"/>
  <text class="nodet" x="570" y="192">RDS / Aurora primary (writer)</text>
  <text class="sub" x="570" y="210">read-your-writes · contends with write load</text>

  <rect class="node" x="420" y="240" width="300" height="50" rx="8"/>
  <text class="nodet" x="570" y="262">S3 strong read-after-write</text>
  <text class="sub" x="570" y="280">automatic for GET/PUT on all objects</text>
</svg>
